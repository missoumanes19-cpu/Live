name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ANES TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: iptv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        run: '[ -d android ] || flutter create --platforms=android --project-name anes_tv .'

      - name: Add INTERNET permission and allow http
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' $M

      - name: Get dependencies
        run: flutter pub get

      - name: Patch plugins to compileSdk 36
        run: |
          PC="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$PC/hosted" -path "*/android/build.gradle*" -type f | while read f; do
            if grep -Eq 'compileSdk(Version)?[ =(]+(2[0-9]|3[0-5])\b' "$f"; then
              sed -i -E 's/(compileSdk(Version)?[ =(]+)(2[0-9]|3[0-5])\b/\136/' "$f"
              echo "PATCHED: $f"
            fi
          done

      - name: Build release APK
        run: >
          flutter build apk --release
          --dart-define=CONFIG_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/xtream_config.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANES-TV-APK
          path: iptv/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
