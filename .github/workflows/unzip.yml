name: Unzip Project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - project.zip

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ZIP (ignore unzip warning quirks)
        id: check
        run: |
          python3 - <<'PY'
          import sys, zipfile
          path = 'project.zip'
          try:
              with zipfile.ZipFile(path) as z:
                  bad = z.testzip()
                  if bad:
                      print(f'ZIP CRC failure in: {bad}')
                      sys.exit(1)
          except FileNotFoundError:
              print('project.zip not found')
              sys.exit(1)
          except zipfile.BadZipFile as e:
              print(f'Invalid ZIP: {e}')
              sys.exit(1)
          print('ZIP validation passed')
          PY

      - name: Extract project files
        run: |
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('project.zip') as z:
              z.extractall('.')
          PY
          rm -rf __MACOSX
          rm -f project.zip

      - name: Install APK workflow from extracted project
        run: |
          if [ ! -f iptv/.github/workflows/build_apk.yml ]; then
            echo "ERROR: iptv/.github/workflows/build_apk.yml is missing from the ZIP"
            exit 1
          fi
          mkdir -p .github/workflows
          cp iptv/.github/workflows/build_apk.yml .github/workflows/build_apk.yml

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Extract project files automatically [skip ci]"
            git push
          fi

      - name: Start APK build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_apk.yml --ref main
