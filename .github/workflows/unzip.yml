name: Unzip Project

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - project.zip

permissions:
  contents: write
  actions: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ZIP
        run: |
          python3 - <<'PY'
          import sys, zipfile
          path = 'project.zip'
          try:
              with zipfile.ZipFile(path) as z:
                  bad = z.testzip()
                  if bad:
                      print(f'ZIP CRC failure in: {bad}')
                      sys.exit(1)
          except FileNotFoundError:
              print('project.zip not found')
              sys.exit(1)
          except zipfile.BadZipFile as e:
              print(f'Invalid ZIP: {e}')
              sys.exit(1)
          print('ZIP validation passed')
          PY

      - name: Extract project files
        run: |
          python3 - <<'PY'
          import pathlib, shutil, sys, zipfile

          with zipfile.ZipFile('project.zip') as z:
              z.extractall('_extract')

          root = pathlib.Path('_extract')
          shutil.rmtree(root / '__MACOSX', ignore_errors=True)

          # ZIP مأخوذ من زر "Download ZIP" في GitHub يحتوي مجلداً واحداً في الأعلى (مثل Live-main/)
          # فندخل داخله حتى تصبح iptv/ في جذر المستودع.
          items = list(root.iterdir())
          src = items[0] if len(items) == 1 and items[0].is_dir() else root

          if not (src / 'iptv' / 'pubspec.yaml').is_file():
              print('ERROR: iptv/pubspec.yaml is missing from the ZIP')
              sys.exit(1)

          # لا ننسخ .github: GITHUB_TOKEN لا يملك صلاحية تعديل ملفات workflows
          # (الدفع يُرفض بخطأ "without workflows permission"). عدّل .github/workflows يدوياً.
          for p in src.rglob('*'):
              rel = p.relative_to(src)
              if rel.parts[0] in ('.git', '.github'):
                  continue
              if p.is_dir():
                  pathlib.Path(rel).mkdir(parents=True, exist_ok=True)
              else:
                  pathlib.Path(rel).parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, rel)

          shutil.rmtree(root)
          pathlib.Path('project.zip').unlink()
          print('Project extracted')
          PY

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Extract project files automatically [skip ci]"
            git push
          fi

      - name: Start APK build workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build_apk.yml --ref main
