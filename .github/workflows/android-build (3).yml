name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # غيّر هذا العنوان إلى موقعك على Cloudflare Pages إذا نشرت الخادم الخاص بك
  VITE_API_URL: https://ahcl.pages.dev

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: Live-TV-Streaming-Platform-main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Live-TV-Streaming-Platform-main/package-lock.json

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Install Capacitor 7
        run: npm install --no-save @capacitor/core@^7 @capacitor/android@^7 @capacitor/cli@^7

      - name: Build web application
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync web assets to Android
        run: npx cap sync android

      # ملف debug قابل للتثبيت مباشرة على الهاتف
      - name: Build Debug APK
        working-directory: Live-TV-Streaming-Platform-main/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      # نسخة release موقّعة: تُبنى فقط إذا أضفت الأسرار (Secrets) التالية في GitHub:
      # KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Build signed Release APK
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        working-directory: Live-TV-Streaming-Platform-main/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          UNSIGNED=$(ls app/build/outputs/apk/release/*-unsigned.apk | head -n 1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" app/build/outputs/apk/release/aligned.apk
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/AHCL-Live-TV-release-signed.apk \
            app/build/outputs/apk/release/aligned.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AHCL-Live-TV-Android-APKs
          path: |
            Live-TV-Streaming-Platform-main/android/app/build/outputs/apk/debug/*.apk
            Live-TV-Streaming-Platform-main/android/app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
          retention-days: 30
