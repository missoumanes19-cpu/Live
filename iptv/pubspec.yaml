name: anes_tv
description: ANES TV IPTV application
publish_to: 'none'
version: 1.3.0+5

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  xml: ^6.5.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.2
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  cached_network_image: ^3.3.1
  crypto: ^3.0.3
  wakelock_plus: ^1.2.8
  file_picker: ^8.1.7
  android_intent_plus: ^5.1.0
  path_provider: ^2.1.3
  video_player: ^2.9.2
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/settings/
