name: ANES TV Android APK

on:
  push:
    branches: [main]
    paths:
      - 'iptv/**'
      - '.github/workflows/build_apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: iptv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: 'flutter-:os:-:channel:-:version:-:arch:-iptv'

      - name: Ensure Android platform files exist
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --project-name anes_tv --org com.anes.tv .
          fi

      - name: Patch Android manifest (INTERNET, http streams, TV, icons, landscape)
        run: python3 tool/patch_android.py

      - name: Use fixed signing key (so new APKs update the installed app)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > ~/.android/debug.keystore
            echo "Signing with the keystore from the repository secret"
          else
            cp tool/anes.keystore ~/.android/debug.keystore
            echo "Signing with tool/anes.keystore (set ANDROID_KEYSTORE_BASE64 secret to keep the key private)"
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Static analysis (does not block the build)
        continue-on-error: true
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Unit tests (does not block the build)
        continue-on-error: true
        run: flutter test

      - name: Read app version
        id: ver
        run: |
          echo "name=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')" >> "$GITHUB_OUTPUT"

      - name: Build release APKs (one per CPU architecture)
        run: >-
          flutter build apk --release --split-per-abi
          --build-name=${{ steps.ver.outputs.name }}
          --build-number=${{ github.run_number }}
          --dart-define=APP_VERSION=${{ steps.ver.outputs.name }}.${{ github.run_number }}
          --dart-define=CONFIG_URL=https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/xtream_config.json

      - name: Name APKs and write checksums
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            mv "$f" "ANES-TV-${{ steps.ver.outputs.name }}-${f#app-}"
          done
          sha256sum ANES-TV-*.apk > SHA256SUMS.txt
          ls -lh

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: ANES-TV-release-apk
          path: |
            iptv/build/app/outputs/flutter-apk/ANES-TV-*.apk
            iptv/build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release (the app checks it for updates)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.ver.outputs.name }}.${{ github.run_number }}"
          gh release create "$TAG" build/app/outputs/flutter-apk/ANES-TV-*.apk build/app/outputs/flutter-apk/SHA256SUMS.txt \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "ANES TV $TAG" \
            --notes "Automatic build #${{ github.run_number }} — install the APK matching your phone (arm64-v8a for most phones)."
          gh release list --repo "${{ github.repository }}" --limit 100 --json tagName --jq '.[5:][].tagName' \
            | xargs -r -n1 gh release delete --cleanup-tag -y --repo "${{ github.repository }}" || true
