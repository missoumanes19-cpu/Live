name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ANES TV APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: iptv
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android folder if missing
        run: '[ -d android ] || flutter create --platforms=android --project-name anes_tv .'

      - name: Add INTERNET permission and allow http
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'permission.INTERNET' $M || sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"|' $M

      - name: Gradle init script - force compileSdk 36
        working-directory: .
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/force-sdk.gradle <<'EOF'
          allprojects {
              afterEvaluate { p ->
                  def a = p.extensions.findByName('android')
                  if (a != null) {
                      try { a.compileSdk = 36 } catch (Throwable t) { a.compileSdkVersion(36) }
                      println "compileSdk forced to 36 for ${p.name}"
                  }
              }
          }
          EOF
          cat ~/.gradle/init.d/force-sdk.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANES-TV-APK
          path: iptv/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
